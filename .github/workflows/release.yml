name: Release
on:
  push:
    tags: [ 'v*' ]

jobs:
  update-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version branches
        run: |
          CLEAN_TAG=$(echo "${{ github.ref_name }}" | sed -E 's/^v([0-9.]+)(([a-z]+)[0-9]*)?(.*)$/\\3-v\\1\\4/')
          CLEAN_TAG=$(echo $CLEAN_TAG | sed -E 's/^-?(.*)/\1/')
          echo "CLEAN_TAG ${CLEAN_TAG} ${{ github.ref_name }}"

          CURRENT_BRANCH="$CLEAN_TAG"
          while [[ "$CURRENT_BRANCH" =~ ^.*v[0-9]+\.[0-9]+.*$ ]]; do
            CURRENT_BRANCH="${CURRENT_BRANCH%.*}"

            if ! git show-ref --verify --quiet "refs/heads/$CURRENT_BRANCH" && \\
               ! git show-ref --verify --quiet "refs/remotes/origin/$CURRENT_BRANCH"; then
              git push origin "${{ github.sha }}:refs/heads/$CURRENT_BRANCH"
              continue
            fi

            git checkout "$CURRENT_BRANCH"
            if git merge --ff "${{ github.sha }}"; then
              git push origin "$CURRENT_BRANCH"
            else # try a full checkout
              git fetch "${{ github.sha }}"
              if git merge --ff "${{ github.sha }}"; then
                git push origin "$CURRENT_BRANCH"
              else
                echo "Skipping $CURRENT_BRANCH: not a fast-forward."
              fi
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
