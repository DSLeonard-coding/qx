[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsleonard-qx"
# 'version' is dynamic because setuptools_scm will generate it
dynamic = ["version"]
description = "a perl-like qx(), ie backticks. Runs a shell command and returns a CompletedProcess"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Doug Leonard", email = "dleonard.dev@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Add your cleaned-up dependencies here later
dependencies = []

[project.urls]
"Homepage" = "https://gitlab.com/douglas_s_leonard/programming_utilities/python/qx"
"Bug Tracker" = "https://gitlab.com/douglas.s.leonard/douglas_s_leonard/programming_utilities/python/qx"

[tool.setuptools]
#qx is now deprecated and is just a shim:
packages = ["dsleonard_qx", "qx"]

[tool.setuptools.package-data]
"dsleonard_qx" = ["py.typed"]

[tool.setuptools_scm]
# Make sure qx/version.py is in your .gitignore!
write_to = "dsleonard_qx/version.py"
git_describe_command = "git describe --dirty --tags --long --match '*v[0-9]*'"
#read tags like [prefix-]v1.3[.4[.5[...]]][rc0][-postfix]  only v1.3 part required
#rc part is kept as a local metadata so v1.3rc0 satifies v1.3 in testing.
#rc tags are not meant to be pushed to pypi.
tag_regex = "^(?:(?P<pre>.*)-)?v(?P<version>[0-9.]+)(?:(?P<local>[a-z]+[0-9]*))?(-(?P<post>r[0-9]+))?.*$"

