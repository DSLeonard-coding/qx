stages:
  - build
  - release


#  Auto tag version updated.  updates v1 when v1.2 is pushed, updates v1.2 when 1.2.4 is pushed.
update-version-branches:
  stage: release
  script:
    - git remote set-url origin "https://oauth2:${GL_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      CLEAN_TAG=$(echo $CI_COMMIT_TAG | sed -E 's/^v([0-9.]+)(([a-z]+)[0-9]*)?(.*)$/\3-v\1\4/')
      CLEAN_TAG=$(echo $CLEAN_TAG | sed -E 's/^-?(.*)/\1/')
      echo Clean_tag ${CLEAN_TAG} $CI_COMMIT_TAG
      CURRENT_BRANCH=$CLEAN_TAG
      while [[ "$CURRENT_BRANCH" =~ ^.*v[0-9]+\.[0-9]+.*$ ]]; do
        CURRENT_BRANCH="${CURRENT_BRANCH%.*}"
        # If the branch doesn't exist  create it
        if ! git show-ref --verify --quiet "refs/heads/$CURRENT_BRANCH" && \
           ! git show-ref --verify --quiet "refs/remotes/origin/$CURRENT_BRANCH"; then
            git push origin "$CI_COMMIT_SHA:refs/heads/$CURRENT_BRANCH" -o ci.skip
            continue
        fi

        # If it exists, checkout and try a fast‑forward merge of the new commit
        git checkout "$CURRENT_BRANCH"
        if git merge --ff "$CI_COMMIT_SHA"; then
            git push origin "$CURRENT_BRANCH" -o ci.skip
        else  # Try a full checkout
            git fetch "$CI_COMMIT_SHA"
            if git merge --ff "$CI_COMMIT_SHA"; then
                git push origin "$CURRENT_BRANCH" -o ci.skip
            else
                echo "Skipping $CURRENT_BRANCH: not a fast‑forward."
            fi
        fi
      done
  rules:
    - if: $CI_COMMIT_TAG
    #Match basically [anything-]v1.2[.3][rc0][-r1]  except a bit looser here:
    # ex  rc-v1.2.1-beta
    #- if: $CI_COMMIT_TAG =~ /^(.+[-\/])?v\\d+(\\.\\d+)*([a-z]+\\d*)?(-.*)?$/
